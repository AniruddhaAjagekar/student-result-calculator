<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #4facfe, #00f2fe);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    padding: 30px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }
  h2 { text-align: center; margin-bottom: 20px; color: #333; }
  .input-group { margin-bottom: 12px; }
  label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #4facfe;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover { background: #00aaff; }
  .result {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    background: #f1f9ff;
    display: none;
  }
  .result p { margin: 6px 0; color: #333; }
  .error { color: red; font-size: 14px; margin-top: 5px; display: none; }
  .pass { color: green; font-weight: bold; }
  .fail { color: red; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <h2>Student Result Calculator</h2>

  <div class="input-group">
    <label for="sub1">Subject 1 Marks</label>
    <input type="number" id="sub1" placeholder="Enter marks (0-100)">
  </div>
  <div class="input-group">
    <label for="sub2">Subject 2 Marks</label>
    <input type="number" id="sub2" placeholder="Enter marks (0-100)">
  </div>
  <div class="input-group">
    <label for="sub3">Subject 3 Marks</label>
    <input type="number" id="sub3" placeholder="Enter marks (0-100)">
  </div>
  <div class="input-group">
    <label for="sub4">Subject 4 Marks</label>
    <input type="number" id="sub4" placeholder="Enter marks (0-100)">
  </div>
  <div class="input-group">
    <label for="sub5">Subject 5 Marks</label>
    <input type="number" id="sub5" placeholder="Enter marks (0-100)">
  </div>

  <div class="error" id="errorMsg">Please enter valid marks between 0 and 100 for all subjects.</div>

  <button onclick="calculateResult()">Calculate Result</button>

  <div class="result" id="resultBox">
    <p><strong>Total Marks:</strong> <span id="totalMarks"></span> / 500</p>
    <p><strong>Percentage:</strong> <span id="percentage"></span>%</p>
    <p><strong>Grade:</strong> <span id="grade"></span></p>
    <p><strong>Status:</strong> <span id="status"></span></p>
  </div>
</div>

<script>
function calculateResult() {
  const ids = ['sub1','sub2','sub3','sub4','sub5'];
  const errorMsg = document.getElementById('errorMsg');
  const resultBox = document.getElementById('resultBox');
  let marks = [];
  let valid = true;

  for (const id of ids) {
    const val = document.getElementById(id).value;
    if (val === '' || isNaN(val) || val < 0 || val > 100) {
      valid = false;
      break;
    }
    marks.push(Number(val));
  }

  if (!valid) {
    errorMsg.style.display = 'block';
    resultBox.style.display = 'none';
    return;
  }
  errorMsg.style.display = 'none';

  const total = marks.reduce((a,b) => a+b, 0);
  const percentage = (total / 500) * 100;

  let grade;
  if (percentage >= 90) grade = 'A+';
  else if (percentage >= 80) grade = 'A';
  else if (percentage >= 70) grade = 'B';
  else if (percentage >= 60) grade = 'C';
  else if (percentage >= 50) grade = 'D';
  else if (percentage >= 40) grade = 'E';
  else grade = 'F';

  const isPass = marks.every(m => m >= 40);

  document.getElementById('totalMarks').textContent = total;
  document.getElementById('percentage').textContent = percentage.toFixed(2);
  document.getElementById('grade').textContent = grade;

  const statusEl = document.getElementById('status');
  if (isPass) {
    statusEl.textContent = 'PASS';
    statusEl.className = 'pass';
  } else {
    statusEl.textContent = 'FAIL';
    statusEl.className = 'fail';
  }

  resultBox.style.display = 'block';
}
</script>

</body>
</html>
